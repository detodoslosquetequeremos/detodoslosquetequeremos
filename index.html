<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Fer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="wrapper">
        <div class="flag__birthday">
            <img src="./images/1.png" alt="" width="350" class="flag__left">
            <img src="./images/1.png" alt="" width="350" class="flag__right">
        </div>
        <div class="jeka-rain" aria-hidden="true">
            <img class="jeka-drop drop1" src="./images/jeka.png" alt="">
            <img class="jeka-drop drop2" src="./images/jeka.png" alt="">
            <img class="jeka-drop drop3" src="./images/jeka.png" alt="">
            <img class="jeka-drop drop4" src="./images/jeka.png" alt="">
            <img class="jeka-drop drop5" src="./images/jeka.png" alt="">
            <img class="jeka-drop drop6" src="./images/jeka.png" alt="">
        </div>
        <div class="content">
            <div class="left">
                <div class="title">
                    <h1 class="happy">
                        <span style="--t: 4s;">F</span><span style="--t: 4.2s;">e</span><span style="--t: 4.4s;">l</span><span style="--t: 4.6s;">i</span><span style="--t: 4.8s;">z</span>
                    </h1>
                    <h1 class="birthday">
                        <span style="--t: 5s;">C</span><span style="--t: 5.2s;">u</span><span style="--t: 5.4s;">m</span><span style="--t: 5.6s;">p</span><span style="--t: 5.8s;">l</span>
                        <span style="--t: 6s;">e</span><span style="--t: 6.2s;">a</span><span style="--t: 6.4s;">ñ</span><span style="--t: 6.6s;">o</span><span style="--t: 6.8s;">s</span>
                    </h1>
                    <div class="hat">
                        <img src="./images/hat.png" alt="" width="130">
                    </div>
                </div>
                <div class="date__of__birth">
                    <span></span>
                </div>
                <div class="btn">
                    <button id="btn__letter">
                        <div class="mail">
                            Haz Clic Aquí
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                    </button>
                </div>
            </div>
            <div class="right">
                <div class="box__account">
                    <div class="image">
                        <img src="./images/fer.png" alt="Fer">
                    </div>
                    <div class="balloon_one">
                        <img width="100px" src="./images/balloon1.png" alt="">
                    </div>
                    <div class="balloon_two">
                        <img width="100px" src="./images/balloon2.png" alt="">
                    </div>
                </div>
                <div class="cricle">
                    <div class="text__cricle">
                        <span style="--i: 1;">h</span><span style="--i: 2;">a</span><span style="--i: 3;">p</span><span style="--i: 4;">p</span><span style="--i: 5;">y</span>
                        <span style="--i: 6;">-</span>
                        <span style="--i: 7;">b</span><span style="--i: 8;">i</span><span style="--i: 9;">r</span><span style="--i: 10;">t</span><span style="--i: 11;">h</span>
                        <span style="--i: 12;">d</span><span style="--i: 13;">a</span><span style="--i: 14;">y</span><span style="--i: 15;">-</span>
                    </div>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
        </div>

        <!-- Decoraciones -->
        <div class="decorate_star star1" style="--t: 15s;"></div>
        <div class="decorate_star star2" style="--t: 15.2s;"></div>
        <div class="decorate_star star3" style="--t: 15.4s;"></div>
        <div class="decorate_star star4" style="--t: 15.6s;"></div>
        <div class="decorate_star star5" style="--t: 15.8s;"></div>
        <div class="decorate_flower--one" style="--t: 15s;"><img width="20" src="./images/decorate_flower.png" alt=""></div>
        <div class="decorate_flower--two" style="--t: 15.3s;"><img width="20" src="./images/decorate_flower.png" alt=""></div>
        <div class="decorate_flower--three" style="--t: 15.6s;"><img width="20" src="./images/decorate_flower.png" alt=""></div>
        <div class="decorate_bottom"><img src="./images/decorate.png" alt="" width="100"></div>
        <div class="smiley__icon"><img src="./images/smiley_icon.png" alt="" width="100"></div>
    </div>

    <!-- Menú de las 7 cartas (Se muestra al hacer clic en el botón principal) -->
    <div class="cards-overlay" id="cardsOverlay">
        <i class="fa-solid fa-xmark close-overlay" id="closeCardsOverlay"></i>
        <h2 class="cards-title">¡Elige una carta!</h2>

        </div>
    </div>

    <!-- Carta individual abierta con animación de acercamiento -->
    <div id="cardDetailModal" class="card-detail-modal">
        <div class="modal-content card-shape">
            <span class="close-btn" id="closeCardDetail">&times;</span>
            <div class="modal-inner">
                <p id="modal-text"></p>
            </div>
            <button type="button" class="back-to-cards" id="backToCards">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                Volver
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
